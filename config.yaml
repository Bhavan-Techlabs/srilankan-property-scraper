# Global price filter for sale listings (applied when the URL doesn't already have price params)
# Set to null to disable
price_filter:
  min: 5000000    # Rs 5 million
  max: 30000000   # Rs 30 million

# Price filter for rental listings — monthly rent, an entirely different scale to
# the sale price_filter above. Adjust to taste; these are a starting point.
rent_price_filter:
  min: 20000      # Rs 20,000 / month
  max: 250000     # Rs 250,000 / month

# Duplicate detection: minimum description similarity ratio (0.0 - 1.0)
similarity_threshold: 0.9

# Delay between HTTP requests in seconds
request_delay: 1.5

# Only scrape ads posted within the last N days
max_age_days: 15

# Maximum pages to scrape per location (safety limit)
max_pages: 20
