name: Scrape (self-hosted local)

on:
  workflow_dispatch:          # manual trigger only — never runs on a schedule

jobs:
  scrape:
    runs-on: self-hosted-local
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS" ]; then
            printenv GOOGLE_CREDENTIALS > credentials.json
          fi

      - name: Run scraper (existing project venv, no install step)
        run: /Users/bhavanloganathan/Downloads/code/ikman-scraper/venv/bin/python main.py

      - name: Upload Excel output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srilanka-house-sales-selfhosted
          path: output/*.xlsx
          retention-days: 7

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f credentials.json
